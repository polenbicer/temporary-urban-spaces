name: Import source archive

on:
  push:
    paths:
      - .github/workflows/unpack-source.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and expand project sources
        run: |
          curl -fsSL https://temporary-urban-spaces.polenbicer.chatgpt.site/temporary-urban-spaces-source.tar.gz -o /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import animated urban spaces site" || exit 0
          git push
