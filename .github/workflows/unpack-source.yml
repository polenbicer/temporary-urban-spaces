name: Import source archive

on:
  push:
    paths:
      - temporary-urban-spaces-source.tar.gz

permissions:
  contents: write

jobs:
  unpack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Expand project sources
        run: |
          if [ ! -f temporary-urban-spaces-source.tar.gz ]; then
            exit 0
          fi
          tar -xzf temporary-urban-spaces-source.tar.gz
          rm temporary-urban-spaces-source.tar.gz
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Import animated urban spaces site"
          git push
